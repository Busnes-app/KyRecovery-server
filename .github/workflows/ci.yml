name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Every checkout uses persist-credentials: false. Nothing after a checkout runs git
# against a remote, so the job token has no reason to sit in .git/config.
jobs:
  go:
    runs-on: ubuntu-latest
    # Go has no in-process SMB server, so the smb replication tests run against
    # Samba here and skip everywhere KYRECOVERY_SMB_TEST is unset.
    services:
      samba:
        image: dperson/samba@sha256:66088b78a19810dd1457a8f39340e95e663c728083efa5fe7dc0d40b2478e869 # latest, 2026-09
        env:
          USER: "ky;correct-horse"
          SHARE: "vault;/share;no;no;no;ky"
          PERMISSIONS: "true" # chown the share to its user, as `samba -p` does
        ports:
          - 1445:445
    env:
      KYRECOVERY_SMB_TEST: "127.0.0.1:1445/vault|ky|correct-horse"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - run: go mod tidy && git diff --exit-code go.mod go.sum && go mod verify
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race -count=1 ./...
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: scripts/build-wasm.sh && git diff --exit-code -- internal/server/static/wasm
      - run: node scripts/test-wasm.mjs
      - run: node scripts/check-contrast.mjs
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t kyrecovery:ci .
      # An image that builds but cannot run is a green build and a broken release.
      - run: docker run --rm kyrecovery:ci help

  # Publishes the image only after every job above has passed, and only for
  # pushes to main: a pull request from a fork must never write a package.
  publish:
    needs: [go, security, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Derived, not spelled out: GITHUB_TOKEN can only write the owning
      # account's namespace, and registries reject a mixed-case name.
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # The commit tag is what lets an operator pin a known-good image and
      # roll back to it; :latest alone gives them nowhere to go.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
