name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Every checkout uses persist-credentials: false. Nothing after a checkout runs git
# against a remote, so the job token has no reason to sit in .git/config.
jobs:
  go:
    runs-on: ubuntu-latest
    # Go has no in-process SMB server, so the smb replication tests run against
    # Samba here and skip everywhere KYRECOVERY_SMB_TEST is unset.
    services:
      samba:
        image: dperson/samba@sha256:66088b78a19810dd1457a8f39340e95e663c728083efa5fe7dc0d40b2478e869 # latest, 2026-09
        env:
          USER: "ky;correct-horse"
          SHARE: "vault;/share;no;no;no;ky"
          PERMISSIONS: "true" # chown the share to its user, as `samba -p` does
        ports:
          - 1445:445
    env:
      KYRECOVERY_SMB_TEST: "127.0.0.1:1445/vault|ky|correct-horse"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - run: go mod tidy && git diff --exit-code go.mod go.sum && go mod verify
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race -count=1 ./...
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: scripts/build-wasm.sh && git diff --exit-code -- internal/server/static/wasm
      - run: node scripts/test-wasm.mjs
      - run: node scripts/check-contrast.mjs
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t kyrecovery:ci .
      # An image that builds but cannot run is a green build and a broken release.
      - run: docker run --rm kyrecovery:ci help

      # Hand the exact image the checks above ran against to the publish job,
      # so what gets pushed is what was tested, never a second build.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          docker save kyrecovery:ci | gzip > tested-image.tar.gz
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tested-image
          path: tested-image.tar.gz
          retention-days: 1

  # Publishes the image CI tested: only for pushes to main, only
  # after every job passed, and with no checkout and no build of its own, so
  # the pushed bytes are the tested bytes. A pull request from a fork must
  # never reach this job or write a package.
  publish:
    needs: [go, security, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # No concurrency group here on purpose: GitHub cancels a *pending* job when a
    # newer one queues into the same group, which would leave that commit with no
    # :<sha> image and no attestation. Every commit that reaches this job gets both.
    outputs:
      name: ${{ steps.push.outputs.name }}
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tested-image
      - run: docker load < tested-image.tar.gz

      - env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # Name derived, not spelled out: GITHUB_TOKEN can only write the owning
      # account's namespace, and registries reject a mixed-case name. Only the
      # commit tag is pushed here; it is what lets an operator pin a known-good
      # image and roll back to it. :latest moves in the promote job, after the
      # attestation verifies.
      - id: push
        run: |
          set -euo pipefail
          name="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag kyrecovery:ci "$name:$GITHUB_SHA"
          docker push "$name:$GITHUB_SHA"
          digest="$(docker buildx imagetools inspect "$name:$GITHUB_SHA" --format '{{.Manifest.Digest}}')"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Binds the pushed manifest to this run and commit. Verifying it here, the
      # way an operator would, proves the attestation is usable and not just present.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: ${{ steps.push.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://$NAME@$DIGEST" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml"


  # :latest advances only to an image whose provenance verified above, and only
  # to the current tip of main. Serialised here, not in publish: a pending
  # promote cancelled by a newer one queuing is harmless, since a newer run
  # existing is exactly what makes this commit no longer the tip. Promotion is
  # by digest, so the bytes that move are the bytes that were attested.
  promote:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: promote-main
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: ${{ needs.publish.outputs.name }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          tip="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "Published \`$NAME@$DIGEST\` as \`:$GITHUB_SHA\` only: main has moved on to $tip" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          docker buildx imagetools create --tag "$NAME:latest" "$NAME@$DIGEST"
          echo "Published \`$NAME@$DIGEST\` as \`:latest\` and \`:$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
