# Source build. Layer over the base file:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d
# The result is tagged kyrecovery-server:local so it never occupies the published name.
services:
  kyrecovery:
    image: kyrecovery-server:local
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
