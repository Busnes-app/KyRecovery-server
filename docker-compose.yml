services:
  kyrecovery:
    # The published, attested image. `pull` moves to the newest one; `up` uses what is
    # present, otherwise pulls. This file never builds: a source build would occupy this
    # name with unattested bytes, so it lives in docker-compose.build.yml under a local tag.
    # Source installs add docker-compose.build.yml to the COMPOSE_FILE chain in .env (other overlays
    # may sit beside it); Compose reads it before every command. An explicit -f list replaces it
    # outright, so never mix the two.
    # To run only what CI attested, pin the commit you chose by digest and verify it first (gh
    # logged in). Tags are movable, :<commit sha> included, so the digest comes from the tag but
    # the guarantee comes from the attestation: it must verify against this workflow on main
    # AND record your commit as its source, or the chain stops. The new .env is staged in this
    # directory and renamed atomically over the old one only if the filtered copy was written
    # in full, so a failed check, an unreadable .env or a short write never replaces your
    # secrets. Re-run with a newer sha to move; delete the KYRECOVERY_IMAGE line to follow :latest
    # again. A source install is unaffected: the build overlay's image wins over this pin.
    #   sha=<full commit sha you intend to run, e.g. $(git rev-parse origin/main)>
    #   d=$(docker buildx imagetools inspect ghcr.io/busnes-app/kyrecovery-server:$sha --format '{{.Manifest.Digest}}') \
    #     && gh attestation verify "oci://ghcr.io/busnes-app/kyrecovery-server@$d" --repo Busnes-app/kyrecovery-server \
    #          --cert-identity https://github.com/Busnes-app/kyrecovery-server/.github/workflows/ci.yml@refs/heads/main \
    #     && [ "$(gh attestation verify "oci://ghcr.io/busnes-app/kyrecovery-server@$d" --repo Busnes-app/kyrecovery-server \
    #          --cert-identity https://github.com/Busnes-app/kyrecovery-server/.github/workflows/ci.yml@refs/heads/main \
    #          --format json --jq '.[0].verificationResult.statement.predicate.buildDefinition.resolvedDependencies[0].digest.gitCommit')" = "$sha" ] \
    #     && (umask 077; t=$(mktemp ./.env.XXXXXX) && touch .env && { grep -v '^KYRECOVERY_IMAGE=' .env || [ $? -eq 1 ]; } > "$t" \
    #         && echo "KYRECOVERY_IMAGE=ghcr.io/busnes-app/kyrecovery-server@$d" >> "$t" && mv "$t" .env) \
    #     && grep -qxF "KYRECOVERY_IMAGE=ghcr.io/busnes-app/kyrecovery-server@$d" .env
    image: ${KYRECOVERY_IMAGE:-ghcr.io/busnes-app/kyrecovery-server:latest}
    pull_policy: missing
    container_name: kyrecovery-server
    restart: unless-stopped
    ports:
      - "8095:8095"
    volumes:
      # kyrecovery.db, secret.key (the keyring master key) and capsules/.
      # Back all three up together: without secret.key the sealed replication
      # credentials, the SSO client secret and the audit chain key are lost.
      # The capsules themselves need the custodians' shares, not this key.
      - ./data:/app/data
    # The port and data directory are entrypoint flags, not environment variables;
    # override the entrypoint to change them. What is read from the environment:
    #   KYRECOVERY_SECRET_KEY      keyring master key (hex or base64); else data/secret.key
    #   KY_SSO_ISSUER, KY_SSO_CLIENT_ID, KY_SSO_CLIENT_SECRET, KY_SSO_REDIRECT_URL
    #   KY_ADMIN_EMAIL             the SSO identity granted admin
    #   KY_ADMIN_INITIAL_PASSWORD  local admin password on first start
    #   KYRECOVERY_COOKIE_SECURE   set true behind TLS
    environment: []
