services:
  kyrecovery:
    # The published, attested image. `pull` moves to the newest one; `up` uses what is
    # present, otherwise pulls. This file never builds: a source build would occupy this
    # name with unattested bytes, so it lives in docker-compose.build.yml under a local tag.
    # Source installs put `COMPOSE_FILE=docker-compose.yml:docker-compose.build.yml` in .env; Compose
    # reads it before every command. An explicit -f list replaces it outright, so never mix the two.
    # To run only what CI attested, pin by digest and verify it first (gh logged in). The
    # chain stops at the first failure, so a failed verify never writes the pin; re-run it
    # to move to a newer image, or delete the KYRECOVERY_IMAGE line to follow :latest again.
    #   d=$(docker buildx imagetools inspect ghcr.io/busness-app/kyrecovery-server:latest --format '{{.Manifest.Digest}}') \
    #   && gh attestation verify "oci://ghcr.io/busness-app/kyrecovery-server@$d" --repo Busness-app/kyrecovery-server \
    #        --cert-identity https://github.com/Busness-app/kyrecovery-server/.github/workflows/ci.yml@refs/heads/main \
    #   && (umask 077; touch .env; sed -i '/^KYRECOVERY_IMAGE=/d' .env; echo "KYRECOVERY_IMAGE=ghcr.io/busness-app/kyrecovery-server@$d" >> .env; chmod 600 .env)
    image: ${KYRECOVERY_IMAGE:-ghcr.io/busness-app/kyrecovery-server:latest}
    pull_policy: missing
    container_name: kyrecovery-server
    restart: unless-stopped
    ports:
      - "8095:8095"
    volumes:
      # kyrecovery.db, secret.key (the keyring master key) and capsules/.
      # Back all three up together: without secret.key the sealed replication
      # credentials, the SSO client secret and the audit chain key are lost.
      # The capsules themselves need the custodians' shares, not this key.
      - ./data:/app/data
    # The port and data directory are entrypoint flags, not environment variables;
    # override the entrypoint to change them. What is read from the environment:
    #   KYRECOVERY_SECRET_KEY      keyring master key (hex or base64); else data/secret.key
    #   KY_SSO_ISSUER, KY_SSO_CLIENT_ID, KY_SSO_CLIENT_SECRET, KY_SSO_REDIRECT_URL
    #   KY_ADMIN_EMAIL             the SSO identity granted admin
    #   KY_ADMIN_INITIAL_PASSWORD  local admin password on first start
    #   KYRECOVERY_COOKIE_SECURE   set true behind TLS
    environment: []
